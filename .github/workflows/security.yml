name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC — catches newly-disclosed CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  alert-on-scheduled-failure:
    name: Open an issue when the weekly scan fails
    runs-on: ubuntu-latest
    needs: [govulncheck]
    # A scheduled red run must never go unnoticed for weeks (it did in
    # Oct 2026: two missed weeks). Open or update a tracking issue.
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = 'Weekly security scan failed';
            const body = [
              'The scheduled govulncheck run failed. This usually means a new',
              'stdlib or dependency CVE affects the module.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Fix: bump the Go toolchain to the latest patch in `go.mod`',
              '(`go mod edit -toolchain=goX.Y.Z`), run `go mod tidy`, and',
              'verify locally with `govulncheck ./...`.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security', per_page: 20,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing on ${new Date().toISOString()}. ${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['security'],
              });
            }

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only run on PRs AND only when the repo is public. The
    # dependency-review action requires GitHub Advanced Security on
    # private repos (a paid GHES/GHAS feature) — on a normal private
    # repo it always fails with "Dependency review is not supported".
    # The check is free and works out-of-the-box on public repos, so we
    # gate on repo visibility and let it start running automatically the
    # moment the project goes public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
