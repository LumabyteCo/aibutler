name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC — catches newly-disclosed CVEs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only run on PRs AND only when the repo is public. The
    # dependency-review action requires GitHub Advanced Security on
    # private repos (a paid GHES/GHAS feature) — on a normal private
    # repo it always fails with "Dependency review is not supported".
    # The check is free and works out-of-the-box on public repos, so we
    # gate on repo visibility and let it start running automatically the
    # moment the project goes public.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
