name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy check
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum is not tidy — run 'go mod tidy' and commit the result"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o /dev/null ./...

  test:
    name: Test (race detector)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -count=1
        run: go test ./... -race -count=1 -timeout=10m
      - name: Coverage report
        run: |
          go test ./... -coverprofile=coverage.out -timeout=10m
          go tool cover -func=coverage.out | tail -1

  desktop-live:
    name: Desktop Tier 4 (Linux live)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Validate the Linux screen-capture + synthetic-input backends
      # end-to-end against a virtual X display (Xvfb): scrot actually
      # captures a PNG and xdotool actually injects input. Gated by the
      # AIBUTLER_DESKTOP_TESTS env var so it only runs in this job.
      #
      # DPkg::Lock::Timeout makes apt WAIT (bounded) for the dpkg lock
      # instead of hanging forever when the runner's background
      # unattended-upgrades holds it at job start.
      - name: Install X virtual framebuffer + screenshot/input tools
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y xvfb scrot xdotool
      - name: Live Tier 4 tests against Xvfb
        env:
          AIBUTLER_DESKTOP_TESTS: "1"
          AIBUTLER_ENABLE_SYNTHETIC_INPUT: "1"
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          go test -count=1 -run TestLive_ -v ./internal/desktop/...

  accessibility-live:
    name: Accessibility Tier 3 (Linux AT-SPI live)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Validate the Linux AT-SPI backend end-to-end against a real
      # accessibility bus: a private session D-Bus auto-activates
      # at-spi2-core, an Xvfb display hosts a GTK app (zenity), and the
      # live test walks its real UI element tree over godbus. Gated by
      # AIBUTLER_ACCESSIBILITY_TESTS so it only runs in this job.
      - name: Install AT-SPI environment + a GTK app
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y xvfb dbus-x11 at-spi2-core zenity
      - name: Live Tier 3 AT-SPI test
        run: |
          dbus-run-session -- bash -c '
            Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
            export DISPLAY=:99
            sleep 2
            export NO_AT_BRIDGE=0
            zenity --info --title="ProbeWindow" --text="AI Butler AT-SPI probe" >/tmp/zenity.log 2>&1 &
            sleep 4
            AIBUTLER_ACCESSIBILITY_TESTS=1 AIBUTLER_A11Y_APP=zenity \
              go test -count=1 -run TestLive_ReadUI -v ./internal/accessibility/...
          '

  integration:
    name: Integration & Security
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration tests
        run: go test ./tests/... -race -count=1 -timeout=10m
      - name: Security audit tests
        run: go test ./internal/security/... -race -count=1 -timeout=5m
